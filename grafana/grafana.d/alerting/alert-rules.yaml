apiVersion: 1
groups:
    - orgId: 1
      name: docker-containers
      folder: Docker
      interval: 1m
      rules:
        - uid: bfmige7il0a2oa
          title: CPU Usage
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 10800
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                datasource:
                    type: prometheus
                    uid: PBFA97CFB590B2093
                editorMode: code
                expr: rate(container_cpu_user_seconds_total{image!=""}[5m]) * 100
                instant: true
                interval: ""
                intervalFactor: 2
                intervalMs: 15000
                legendFormat: '{{service}}'
                maxDataPoints: 43200
                metric: cpu
                range: false
                refId: A
                step: 10
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 79
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          dashboardUid: salt_box
          panelId: 25
          noDataState: NoData
          execErrState: Error
          for: 5m
          annotations:
            __dashboardUid__: salt_box
            __panelId__: "25"
            description: "Алерт срабатывает, когда нагрузка CPU в Docker-контейнере превышает 79% \nна протяжении 5 минут\n\nКонтейнер: {{ $labels.service }}\nТекущее значение: {{ $values.A.Value | printf \"%.1f\" }}%"
            summary: Высокая нагрузка на CPU в контейнере {{ $labels.service }}
          isPaused: false
          notification_settings:
            receiver: '[MAIN] Email Receiver'
    - orgId: 1
      name: docker-ram
      folder: Docker
      interval: 1m
      rules:
        - uid: cfmipxb86p91cc
          title: Memory Usage Docker
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 10800
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                datasource:
                    type: prometheus
                    uid: PBFA97CFB590B2093
                editorMode: code
                expr: |-
                    container_memory_usage_bytes{name=~".+"}
                      / scalar(node_memory_MemTotal_bytes) * 100
                instant: true
                interval: ""
                intervalFactor: 2
                intervalMs: 15000
                legendFormat: '{{service}}'
                maxDataPoints: 43200
                metric: container_memory_usage_bytes
                range: false
                refId: A
                step: 10
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 60
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          dashboardUid: salt_box
          panelId: 26
          noDataState: NoData
          execErrState: Error
          for: 2m
          keepFiringFor: 5m
          annotations:
            __dashboardUid__: salt_box
            __panelId__: "26"
            description: "Алерт срабатывает, когда потребление памяти Docker-контейнера превышает 60% \nот общего объёма RAM сервера"
            summary: Контейнер {{ $labels.service }} потребляет {{ $values.A.Value | printf "%.1f" }}% RAM сервера
          isPaused: false
          notification_settings:
            receiver: '[MAIN] Email Receiver'
    - orgId: 1
      name: backend
      folder: Salt.Box
      interval: 1m
      rules:
        - uid: bfmj2hszbgdmof
          title: HTTP 5xx %
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 10800
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                datasource:
                    type: prometheus
                    uid: PBFA97CFB590B2093
                editorMode: code
                expr: |-
                    sum by(endpoint) (http_request_endpoint_count{status_code=~"5.*"})
                    /
                    sum by(endpoint) (http_request_endpoint_count)
                    * 100
                instant: true
                interval: ""
                intervalMs: 15000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 5
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          dashboardUid: salt_box
          panelId: 14
          noDataState: NoData
          execErrState: Error
          for: 2m
          keepFiringFor: 5m
          annotations:
            __dashboardUid__: salt_box
            __panelId__: "14"
            description: |-
                Алерт срабатывает, когда доля 5xx ответов превышает 5%
                на протяжении 2 минут

                Эндпоинт: {{ $labels.endpoint }}
                Процент ошибок: {{ $values.A.Value | printf "%.1f" }}%
            summary: 'Высокий процент 5xx ошибок на эндпоинте {{ $labels.endpoint }}: {{ $values.A.Value | printf "%.1f" }}%'
          isPaused: false
          notification_settings:
            receiver: '[MAIN] Email Receiver'
    - orgId: 1
      name: backend-container-live-status
      folder: Salt.Box
      interval: 1m
      rules:
        - uid: efmspisog4qo0d
          title: Service Running Status
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 10800
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                datasource:
                    type: prometheus
                    uid: PBFA97CFB590B2093
                editorMode: code
                expr: (time() - container_last_seen{name!="", image!=""}) < bool 60
                instant: true
                interval: ""
                intervalMs: 15000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          dashboardUid: salt_box
          panelId: 68
          noDataState: NoData
          execErrState: Error
          for: 1m
          keepFiringFor: 2m
          annotations:
            __dashboardUid__: salt_box
            __panelId__: "68"
            description: |-
                Алерт срабатывает, когда контейнер перестаёт отвечать более 60 секунд.

                Контейнер: {{ $labels.container_label_com_docker_compose_service }}
                Образ: {{ $labels.image }}
            summary: Контейнер {{ $labels.container_label_com_docker_compose_service }} упал !!!
          isPaused: false
          notification_settings:
            receiver: '[MAIN] Email Receiver'
    - orgId: 1
      name: host-cpu
      folder: Host
      interval: 1m
      rules:
        - uid: dfmito4p7bfuod
          title: Host CPU Usage
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                datasource:
                    type: prometheus
                    uid: PBFA97CFB590B2093
                editorMode: code
                expr: (1 - avg(rate(node_cpu_seconds_total{instance="host.saltbox:9100", job="node", mode="idle"}[5m]))) * 100
                hide: false
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 85
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params: []
                      reducer:
                        params: []
                        type: avg
                      type: query
                datasource:
                    name: Expression
                    type: __expr__
                    uid: __expr__
                expression: A
                hide: false
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          dashboardUid: salt_box
          panelId: 40
          noDataState: NoData
          execErrState: Error
          for: 5m
          annotations:
            __dashboardUid__: salt_box
            __panelId__: "40"
            description: |-
                Алерт срабатывает, когда суммарная нагрузка CPU превышает 85%
                на протяжении 5 минут.

                Текущая нагрузка: {{ $values.A.Value | printf "%.1f" }}%
            summary: 'Высокая нагрузка CPU на хосте: {{ $values.A.Value | printf "%.1f" }}%'
          isPaused: false
          notification_settings:
            receiver: '[MAIN] Email Receiver'
    - orgId: 1
      name: host-ram
      folder: Host
      interval: 1m
      rules:
        - uid: cfmiyn7xsc0zkd
          title: Host RAM Usage
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                datasource:
                    type: prometheus
                    uid: PBFA97CFB590B2093
                editorMode: code
                expr: "(1 - (node_memory_MemAvailable_bytes{instance=\"host.saltbox:9100\", job=\"node\"} \n  / node_memory_MemTotal_bytes{instance=\"host.saltbox:9100\", job=\"node\"})) * 100"
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 95
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params: []
                      reducer:
                        params: []
                        type: avg
                      type: query
                datasource:
                    name: Expression
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          dashboardUid: salt_box
          panelId: 41
          noDataState: NoData
          execErrState: Error
          for: 2m
          keepFiringFor: 5m
          annotations:
            __dashboardUid__: salt_box
            __panelId__: "41"
            description: |-
                Алерт срабатывает, когда использование RAM превышает 95%
                на протяжении 5 минут

                Текущее использование RAM: {{ $values.A.Value | printf "%.1f" }}%
            summary: 'Высокая нагрузка RAM на хосте: {{ $values.A.Value | printf "%.1f" }}%'
          isPaused: false
          notification_settings:
            receiver: '[MAIN] Email Receiver'
